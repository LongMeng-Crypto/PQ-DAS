<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1245" viewBox="0 0 1800 1245">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #27324a; stroke-width: 2.2; rx: 18; }
      .panel-soft { fill: #ffffff; stroke: #3b4868; stroke-width: 1.8; rx: 16; }
      .title { font-family: Inter, Arial, sans-serif; font-weight: 700; font-size: 25px; fill: #172033; }
      .label { font-family: Inter, Arial, sans-serif; font-weight: 600; font-size: 22px; fill: #172033; }
      .math { font-family: 'DejaVu Serif', Georgia, serif; font-style: italic; font-size: 24px; fill: #101827; }
      .math-small { font-family: 'DejaVu Serif', Georgia, serif; font-style: italic; font-size: 20px; fill: #101827; }
      .sub { font-size: 14px; baseline-shift: sub; }
      .cell { fill: #e8eefc; stroke: #49608c; stroke-width: 1.5; rx: 7; }
      .digest { fill: #e9f7f0; stroke: #3b8d63; stroke-width: 1.5; rx: 7; }
      .sysbox { fill: none; stroke: #d17a22; stroke-width: 2.2; stroke-dasharray: 8 6; rx: 8; }
      .colbox { fill: none; stroke: #d17a22; stroke-width: 2.0; stroke-dasharray: 8 6; rx: 10; }
      .hash { fill: #fff2cc; stroke: #b7791f; stroke-width: 2; }
      .merkle { fill: #ffe5e5; stroke: #b64242; stroke-width: 2; }
      .root { fill: #f3e8ff; stroke: #6b46c1; stroke-width: 2; rx: 12; }
      .arrow { stroke: #23324f; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .thin { stroke: #6a7590; stroke-width: 1.7; fill: none; }
      .orange { stroke: #d17a22; stroke-width: 2.0; fill: none; }
      .red { stroke: #b64242; stroke-width: 2.0; fill: none; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#23324f"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1800" height="1245"/>

  <!-- 1. Data blobs -->
  <g transform="translate(40,35)">
    <rect class="panel" x="0" y="0" width="390" height="270"/>
    <text class="title" x="22" y="42">1. Data blobs</text>
    <rect class="cell" x="74" y="75" width="242" height="42"/><text class="math" x="178" y="103">b<tspan class="sub">1</tspan></text>
    <rect class="cell" x="74" y="129" width="242" height="42"/><text class="math" x="178" y="157">b<tspan class="sub">2</tspan></text>
    <text class="math" x="187" y="198">...</text>
    <rect class="cell" x="74" y="218" width="242" height="42"/><text class="math" x="178" y="246">b<tspan class="sub">n</tspan></text>
  </g>
  <path class="arrow" d="M 438 170 L 492 170"/>

  <!-- 2. RS codewords -->
  <g transform="translate(500,35)">
    <rect class="panel" x="0" y="0" width="390" height="270"/>
    <text class="title" x="22" y="42">2. RS codewords</text>
    <rect class="cell" x="42" y="76" width="306" height="42"/><text class="math" x="166" y="104">w<tspan class="sub">1</tspan></text>
    <rect class="cell" x="42" y="130" width="306" height="42"/><text class="math" x="166" y="158">w<tspan class="sub">2</tspan></text>
    <text class="math" x="184" y="199">...</text>
    <rect class="cell" x="42" y="214" width="306" height="42"/><text class="math" x="166" y="242">w<tspan class="sub">n</tspan></text>
  </g>
  <path class="arrow" d="M 898 170 L 952 170"/>

  <!-- 3. Split into cells -->
  <g transform="translate(960,35)">
    <rect class="panel" x="0" y="0" width="390" height="270"/>
    <text class="title" x="22" y="42">3. Split codeword into cells</text>
    <g transform="translate(37,72)">
      <rect class="cell" x="0" y="0" width="66" height="38"/><text class="math-small" x="15" y="25">W<tspan class="sub">1,1</tspan></text>
      <rect class="cell" x="78" y="0" width="66" height="38"/><text class="math-small" x="93" y="25">W<tspan class="sub">1,2</tspan></text>
      <text class="math" x="158" y="27">...</text>
      <rect class="cell" x="210" y="0" width="82" height="38"/><text class="math-small" x="222" y="25">W<tspan class="sub">1,ℓ</tspan></text>
      <rect class="cell" x="0" y="54" width="66" height="38"/><text class="math-small" x="15" y="79">W<tspan class="sub">2,1</tspan></text>
      <rect class="cell" x="78" y="54" width="66" height="38"/><text class="math-small" x="93" y="79">W<tspan class="sub">2,2</tspan></text>
      <text class="math" x="158" y="81">...</text>
      <rect class="cell" x="210" y="54" width="82" height="38"/><text class="math-small" x="222" y="79">W<tspan class="sub">2,ℓ</tspan></text>
      <text class="math" x="126" y="122">...</text>
      <rect class="cell" x="0" y="140" width="66" height="38"/><text class="math-small" x="15" y="165">W<tspan class="sub">n,1</tspan></text>
      <rect class="cell" x="78" y="140" width="66" height="38"/><text class="math-small" x="93" y="165">W<tspan class="sub">n,2</tspan></text>
      <text class="math" x="158" y="167">...</text>
      <rect class="cell" x="210" y="140" width="82" height="38"/><text class="math-small" x="222" y="165">W<tspan class="sub">n,ℓ</tspan></text>
    </g>
  </g>
  <path class="arrow" d="M 1358 170 L 1412 170"/>

  <!-- 4. Hash each cell -->
  <g transform="translate(1420,35)">
    <rect class="panel" x="0" y="0" width="340" height="270"/>
    <text class="title" x="22" y="42">4. Hash each cell</text>
    <g transform="translate(36,72)">
      <rect class="digest" x="0" y="0" width="58" height="36"/><text class="math-small" x="12" y="24">e<tspan class="sub">1,1</tspan></text>
      <rect class="digest" x="70" y="0" width="58" height="36"/><text class="math-small" x="82" y="24">e<tspan class="sub">1,2</tspan></text>
      <text class="math" x="140" y="25">...</text>
      <rect class="digest" x="190" y="0" width="70" height="36"/><text class="math-small" x="202" y="24">e<tspan class="sub">1,ℓ</tspan></text>
      <rect class="digest" x="0" y="52" width="58" height="36"/><text class="math-small" x="12" y="76">e<tspan class="sub">2,1</tspan></text>
      <rect class="digest" x="70" y="52" width="58" height="36"/><text class="math-small" x="82" y="76">e<tspan class="sub">2,2</tspan></text>
      <text class="math" x="140" y="77">...</text>
      <rect class="digest" x="190" y="52" width="70" height="36"/><text class="math-small" x="202" y="76">e<tspan class="sub">2,ℓ</tspan></text>
      <text class="math" x="112" y="118">...</text>
      <rect class="digest" x="0" y="140" width="58" height="36"/><text class="math-small" x="12" y="164">e<tspan class="sub">n,1</tspan></text>
      <rect class="digest" x="70" y="140" width="58" height="36"/><text class="math-small" x="82" y="164">e<tspan class="sub">n,2</tspan></text>
      <text class="math" x="140" y="165">...</text>
      <rect class="digest" x="190" y="140" width="70" height="36"/><text class="math-small" x="202" y="164">e<tspan class="sub">n,ℓ</tspan></text>
    </g>
  </g>

  <!-- 5a -->
  <g transform="translate(55,375)">
    <rect class="panel" x="0" y="0" width="725" height="330"/>
    <text class="title" x="22" y="42">5a. Systematic digest hash chain</text>
    <g transform="translate(42,78)">
      <g>
        <rect class="digest" x="0" y="0" width="66" height="36"/><text class="math-small" x="14" y="24">e<tspan class="sub">1,1</tspan></text>
        <rect class="digest" x="76" y="0" width="66" height="36"/><text class="math-small" x="90" y="24">e<tspan class="sub">1,2</tspan></text>
        <text class="math" x="164" y="25">...</text>
        <rect class="digest" x="206" y="0" width="76" height="36"/><text class="math-small" x="218" y="24">e<tspan class="sub">1,t</tspan></text>
        <rect class="digest" x="306" y="0" width="76" height="36"/><text class="math-small" x="318" y="24">e<tspan class="sub">1,ℓ</tspan></text>
        <rect class="sysbox" x="-8" y="-8" width="158" height="52"/>
      </g>
      <g transform="translate(0,60)">
        <rect class="digest" x="0" y="0" width="66" height="36"/><text class="math-small" x="14" y="24">e<tspan class="sub">2,1</tspan></text>
        <rect class="digest" x="76" y="0" width="66" height="36"/><text class="math-small" x="90" y="24">e<tspan class="sub">2,2</tspan></text>
        <text class="math" x="164" y="25">...</text>
        <rect class="digest" x="206" y="0" width="76" height="36"/><text class="math-small" x="218" y="24">e<tspan class="sub">2,t</tspan></text>
        <rect class="digest" x="306" y="0" width="76" height="36"/><text class="math-small" x="318" y="24">e<tspan class="sub">2,ℓ</tspan></text>
        <rect class="sysbox" x="-8" y="-8" width="158" height="52"/>
      </g>
      <text class="math" x="164" y="139">...</text>
      <g transform="translate(0,164)">
        <rect class="digest" x="0" y="0" width="66" height="36"/><text class="math-small" x="14" y="24">e<tspan class="sub">n,1</tspan></text>
        <rect class="digest" x="76" y="0" width="66" height="36"/><text class="math-small" x="90" y="24">e<tspan class="sub">n,2</tspan></text>
        <text class="math" x="164" y="25">...</text>
        <rect class="digest" x="206" y="0" width="76" height="36"/><text class="math-small" x="218" y="24">e<tspan class="sub">n,t</tspan></text>
        <rect class="digest" x="306" y="0" width="76" height="36"/><text class="math-small" x="318" y="24">e<tspan class="sub">n,ℓ</tspan></text>
        <rect class="sysbox" x="-8" y="-8" width="158" height="52"/>
      </g>
      <circle class="hash" cx="475" cy="18" r="27"/><text class="math-small" x="461" y="25">H<tspan class="sub">r</tspan></text>
      <circle class="hash" cx="475" cy="78" r="27"/><text class="math-small" x="461" y="85">H<tspan class="sub">r</tspan></text>
      <circle class="hash" cx="475" cy="182" r="27"/><text class="math-small" x="461" y="189">H<tspan class="sub">r</tspan></text>
      <path class="orange" d="M 150 18 C 235 -46 382 -50 448 18"/>
      <path class="orange" d="M 150 78 C 235 14 382 10 448 78"/>
      <path class="orange" d="M 150 182 C 235 118 382 114 448 182"/>
      <rect class="root" x="545" y="0" width="76" height="38"/><text class="math-small" x="562" y="25">r<tspan class="sub">1</tspan></text>
      <rect class="root" x="545" y="60" width="76" height="38"/><text class="math-small" x="562" y="85">r<tspan class="sub">2</tspan></text>
      <text class="math" x="570" y="139">...</text>
      <rect class="root" x="545" y="164" width="76" height="38"/><text class="math-small" x="562" y="189">r<tspan class="sub">n</tspan></text>
      <path class="thin" d="M 502 18 L 545 18"/><path class="thin" d="M 502 78 L 545 78"/><path class="thin" d="M 502 182 L 545 182"/>
    </g>
  </g>

  <!-- 5b -->
  <g transform="translate(820,375)">
    <rect class="panel-soft" x="0" y="0" width="410" height="330"/>
    <text class="title" x="22" y="42">5b. Row Merkle aggregation</text>
    <rect class="root" x="52" y="86" width="76" height="38"/><text class="math-small" x="70" y="111">r<tspan class="sub">1</tspan></text>
    <rect class="root" x="52" y="140" width="76" height="38"/><text class="math-small" x="70" y="165">r<tspan class="sub">2</tspan></text>
    <text class="math" x="78" y="207">...</text>
    <rect class="root" x="52" y="226" width="76" height="38"/><text class="math-small" x="70" y="251">r<tspan class="sub">n</tspan></text>
    <circle class="merkle" cx="205" cy="159" r="34"/><text class="math-small" x="190" y="166">M<tspan class="sub">r</tspan></text>
    <rect class="root" x="270" y="132" width="118" height="54"/><text class="math-small" x="286" y="165">root<tspan class="sub">row</tspan></text>
    <path class="red" d="M 128 105 L 174 150"/><path class="red" d="M 128 159 L 171 159"/><path class="red" d="M 128 245 L 174 170"/><path class="red" d="M 239 159 L 270 159"/>
  </g>
  
  <!-- 6a -->
  <g transform="translate(55,760)">
    <rect class="panel" x="0" y="0" width="620" height="445"/>
    <text class="title" x="22" y="42">6a. Inner column Merkle</text>
    <g transform="translate(54,78)">
      <rect class="colbox" x="-10" y="-10" width="78" height="226"/>
      <rect class="colbox" x="100" y="-10" width="78" height="226"/>
      <rect class="colbox" x="255" y="-10" width="90" height="226"/>
      <rect class="digest" x="0" y="0" width="58" height="36"/><text class="math-small" x="12" y="24">e<tspan class="sub">1,1</tspan></text>
      <rect class="digest" x="0" y="58" width="58" height="36"/><text class="math-small" x="12" y="82">e<tspan class="sub">2,1</tspan></text>
      <text class="math" x="15" y="128">...</text>
      <rect class="digest" x="0" y="168" width="58" height="36"/><text class="math-small" x="12" y="192">e<tspan class="sub">n,1</tspan></text>
      <rect class="digest" x="110" y="0" width="58" height="36"/><text class="math-small" x="122" y="24">e<tspan class="sub">1,2</tspan></text>
      <rect class="digest" x="110" y="58" width="58" height="36"/><text class="math-small" x="122" y="82">e<tspan class="sub">2,2</tspan></text>
      <text class="math" x="125" y="128">...</text>
      <rect class="digest" x="110" y="168" width="58" height="36"/><text class="math-small" x="122" y="192">e<tspan class="sub">n,2</tspan></text>
      <text class="math" x="203" y="105">...</text>
      <rect class="digest" x="270" y="0" width="66" height="36"/><text class="math-small" x="282" y="24">e<tspan class="sub">1,ℓ</tspan></text>
      <rect class="digest" x="270" y="58" width="66" height="36"/><text class="math-small" x="282" y="82">e<tspan class="sub">2,ℓ</tspan></text>
      <text class="math" x="288" y="128">...</text>
      <rect class="digest" x="270" y="168" width="66" height="36"/><text class="math-small" x="282" y="192">e<tspan class="sub">n,ℓ</tspan></text>
      <circle class="merkle" cx="29" cy="248" r="28"/><text class="math-small" x="12" y="255">M<tspan class="sub">c</tspan></text>
      <circle class="merkle" cx="139" cy="248" r="28"/><text class="math-small" x="122" y="255">M<tspan class="sub">c</tspan></text>
      <circle class="merkle" cx="303" cy="248" r="28"/><text class="math-small" x="286" y="255">M<tspan class="sub">c</tspan></text>
      <path class="red" d="M 29 216 L 29 220"/><path class="red" d="M 139 216 L 139 220"/><path class="red" d="M 303 216 L 303 220"/>
      <rect class="root" x="-7" y="292" width="72" height="40"/><text class="math-small" x="10" y="318">C<tspan class="sub">1</tspan></text>
      <rect class="root" x="103" y="292" width="72" height="40"/><text class="math-small" x="120" y="318">C<tspan class="sub">2</tspan></text>
      <text class="math" x="209" y="319">...</text>
      <rect class="root" x="264" y="292" width="78" height="40"/><text class="math-small" x="280" y="318">C<tspan class="sub">ℓ</tspan></text>
      <path class="thin" d="M 29 276 L 29 292"/><path class="thin" d="M 139 276 L 139 292"/><path class="thin" d="M 303 276 L 303 292"/>
    </g>
  </g>

  <!-- 6b -->
  <g transform="translate(720,760)">
    <rect class="panel-soft" x="0" y="0" width="400" height="445"/>
    <text class="title" x="22" y="42">6b. Outer column Merkle</text>
    <rect class="root" x="55" y="105" width="72" height="40"/><text class="math-small" x="72" y="131">C<tspan class="sub">1</tspan></text>
    <rect class="root" x="55" y="160" width="72" height="40"/><text class="math-small" x="72" y="186">C<tspan class="sub">2</tspan></text>
    <text class="math" x="79" y="228">...</text>
    <rect class="root" x="55" y="250" width="78" height="40"/><text class="math-small" x="72" y="276">C<tspan class="sub">ℓ</tspan></text>
    <circle class="merkle" cx="210" cy="180" r="36"/><text class="math-small" x="193" y="187">M<tspan class="sub">col</tspan></text>
    <rect class="root" x="270" y="154" width="102" height="52"/><text class="math-small" x="281" y="186">root<tspan class="sub">col</tspan></text>
    <path class="red" d="M 127 125 L 178 170"/><path class="red" d="M 127 180 L 174 180"/><path class="red" d="M 133 270 L 178 192"/><path class="red" d="M 246 180 L 270 180"/>
  </g>

  <!-- 7 -->
  <g transform="translate(1180,760)">
    <rect class="panel-soft" x="0" y="0" width="560" height="445"/>
    <text class="title" x="22" y="42">7. Final aggregation</text>
    <rect class="root" x="62" y="115" width="118" height="50"/><text class="math-small" x="78" y="146">root<tspan class="sub">row</tspan></text>
    <rect class="root" x="62" y="205" width="118" height="50"/><text class="math-small" x="78" y="236">root<tspan class="sub">col</tspan></text>
    <circle class="hash" cx="275" cy="185" r="34"/><text class="label" x="264" y="193">H</text>
    <rect class="root" x="370" y="161" width="96" height="50"/><text class="math-small" x="397" y="192">root</text>
    <path class="orange" d="M 180 140 L 244 176"/><path class="orange" d="M 180 230 L 244 194"/><path class="orange" d="M 309 185 L 370 185"/>
  </g>
</svg>
